[project]
name = "deputy-cli"
version = "0.1.0"
description = "A code intelligence CLI tool for querying and navigating code entities."
readme = "README.md"
authors = [
    { name = "Gurveer Singh Virk", email = "gurveervirk.15517@gmail.com" }
]
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "deproc-core>=0.1.0",
    "deproc-python>=0.1.0",
    "deproc-utils-tree-sitter>=0.1.0",
    "deproc-utils-python-env>=0.1.0",
    "typer>=0.26.8",
    "rich>=13.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
deputy = "deputy:main"

[project.urls]
Homepage = "https://github.com/gurveervirk/deputy"
Repository = "https://github.com/gurveervirk/deputy"
Documentation = "https://gurveervirk.github.io/deputy/"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "zensical>=0.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deputy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
deproc-core = { path = "../deproc/deproc-core", editable = true }
deproc-python = { path = "../deproc/deproc-python", editable = true }
deproc-utils-tree-sitter = { path = "../deproc/deproc-utils-tree-sitter", editable = true }
deproc-utils-python-env = { path = "../deproc/deproc-utils-python-env", editable = true }
