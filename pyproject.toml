[project]
name = "deputy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gurveer Singh Virk", email = "gurveervirk.15517@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deproc-core",
    "deproc-python",
    "deproc-utils-tree-sitter",
    "typer>=0.26.8",
    "rich>=13.0.0",
]

[project.scripts]
deputy = "deputy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
deproc-core = { path = "../deproc/deproc-core", editable = true }
deproc-python = { path = "../deproc/deproc-python", editable = true }
deproc-utils-tree-sitter = { path = "../deproc/deproc-utils-tree-sitter", editable = true }
