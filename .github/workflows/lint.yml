name: lint

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      deproc_ref:
        description: "deproc branch/ref to test against (overrides .github/deproc-ref)"
        required: false

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout deputy
      uses: actions/checkout@v5

    - name: Determine deproc ref
      id: deproc
      env:
        DEPROC_REF_INPUT: ${{ inputs.deproc_ref }}
      run: |
        if [ -n "$DEPROC_REF_INPUT" ]; then
          echo "ref=$DEPROC_REF_INPUT" >> "$GITHUB_OUTPUT"
        else
          echo "ref=$(cat .github/deproc-ref)" >> "$GITHUB_OUTPUT"
        fi

    - name: Clone deproc
      run: git clone --depth 1 --branch "${{ steps.deproc.outputs.ref }}" https://github.com/gurveervirk/deproc.git ../deproc

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync

    - name: Run ruff check
      run: uv run ruff check .

    - name: Run ruff format check
      run: uv run ruff format --check .

    - name: Run basedpyright
      run: uv run basedpyright
