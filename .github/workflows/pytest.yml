name: pytests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      deproc_ref:
        description: "deproc branch/ref to test against (overrides .github/deproc-ref)"
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13" ]

    steps:
    - name: Checkout deputy
      uses: actions/checkout@v5

    - name: Determine deproc ref
      id: deproc
      env:
        DEPROC_REF_INPUT: ${{ inputs.deproc_ref }}
      run: |
        if [ -n "$DEPROC_REF_INPUT" ]; then
          echo "ref=$DEPROC_REF_INPUT" >> "$GITHUB_OUTPUT"
        else
          echo "ref=$(cat .github/deproc-ref)" >> "$GITHUB_OUTPUT"
        fi

    - name: Clone deproc
      run: git clone --depth 1 --branch "${{ steps.deproc.outputs.ref }}" https://github.com/gurveervirk/deproc.git ../deproc

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --python ${{ matrix.python-version }}

    - name: Run pytest with coverage
      run: uv run pytest --cov --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
