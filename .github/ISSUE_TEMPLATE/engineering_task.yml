name: Engineering task
description: A scoped piece of technical work such as a refactor, test, CI, or dependency change
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this task achieves and why it is needed.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope, and what is explicitly out of scope.
      placeholder: |
        In scope:
        - ...
        Out of scope:
        - ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation expectations
      description: The checks and tests that must pass, and any manual verification needed.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Prerequisite or dependent pull requests, issues, or work in the other repository.
