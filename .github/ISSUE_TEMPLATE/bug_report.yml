name: Bug report
description: Something behaves differently from what is documented or expected
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal sequence, with commands or a small code sample.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full error output or traceback.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Package versions, Python version, and operating system.
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Related issues or pull requests, and anything already tried.
